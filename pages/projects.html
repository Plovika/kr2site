    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
<a href="#main" class="skip-link">К содержимому</a>

<header class="header text-center py-4 shadow-sm bg-white sticky-top" role="banner">
    <div class="container">
        <img src="../images/logo.png" alt="Логотип" class="header__logo mb-2" width="60" height="60">
        <h1 class="header__title">Дёмина Екатерина</h1>
        <nav class="nav justify-content-center mt-3" aria-label="Главная навигация">
            <a href="../index.html" class="nav__link">Главная</a>
            <a href="projects.html" class="nav__link nav__link--active" aria-current="page">Проекты</a>
            <a href="diary.html" class="nav__link">Дневник</a>
            <a href="contacts.html" class="nav__link">Контакты</a>
        </nav>
    </div>
</header>

<main id="main" class="container my-5" role="main" aria-labelledby="projects-heading">
    <section class="section-card p-4">
        <h2 id="projects-heading" class="section-title text-center mb-4">Мои проекты</h2>

        <!-- Фильтры -->
        <div class="text-center mb-4" role="region" aria-label="Фильтр проектов">
            <button class="btn btn-outline-primary me-2 filter-btn active" data-filter="all" aria-pressed="true">Все</button>
            <button class="btn btn-outline-secondary me-2 filter-btn" data-filter="html" aria-pressed="false">HTML</button>
            <button class="btn btn-outline-success me-2 filter-btn" data-filter="js" aria-pressed="false">JS</button>
            <button class="btn btn-warning text-dark filter-btn" data-filter="react" aria-pressed="false">React</button>
        </div>

        <div id="filter-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

        <!-- Карточки проектов -->
        <div class="row g-4" id="projects-container" role="list" aria-label="Список проектов">

            <div class="col-md-6 col-lg-4 project-card-container" data-category="html" role="listitem" aria-label="Личный сайт — HTML, CSS">
                <a href="https://plovika.github.io/kr1site/index.html" target="_blank" class="card project-card shadow-sm text-decoration-none" rel="noopener">
                    <picture>
                        <source srcset="../images/project1-small.jpg" media="(max-width: 768px)">
                        <source srcset="../images/project1-large.jpg" media="(min-width: 769px)">
                        <img src="../images/project1-large.jpg" alt="Скриншот личного сайта с навигацией и секциями" class="project-img card-img-top" loading="lazy" width="400" height="250">
                    </picture>
                    <div class="card-body text-center">
                        <h3 class="card-title h5">Личный сайт</h3>
                        <p class="card-text">HTML, CSS</p>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4 project-card-container" data-category="js" role="listitem" aria-label="Todo-приложение — JavaScript">
                <a href="https://app.weeek.net/sign-up?lang=ru" target="_blank" class="card project-card shadow-sm text-decoration-none" rel="noopener">
                    <picture>
                        <source srcset="../images/project2-small.jpg" media="(max-width: 768px)">
                        <source srcset="../images/project2-large.jpg" media="(min-width: 769px)">
                        <img src="../images/project2-large.jpg" alt="Скриншот Todo-приложения со списком задач" class="project-img card-img-top" loading="lazy" width="400" height="250">
                    </picture>
                    <div class="card-body text-center">
                        <h3 class="card-title h5"> Todo-приложение</h3>
                        <p class="card-text">JavaScript</p>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4 project-card-container" data-category="react" role="listitem" aria-label="Интернет-магазин — React">
                <a href="https://react-shop-demo.netlify.app" target="_blank" class="card project-card shadow-sm text-decoration-none" rel="noopener">
                    <picture>
                        <source srcset="../images/project3-small.jpg" media="(max-width: 768px)">
                        <source srcset="../images/project3-large.jpg" media="(min-width: 769px)">
                        <img src="../images/project3-large.jpg" alt="Скриншот интернет-магазина с товарами и корзиной" class="project-img card-img-top" loading="lazy" width="400" height="250">
                    </picture>
                    <div class="card-body text-center">
                        <h3 class="card-title h5">Интернет-магазин</h3>
                        <p class="card-text">React</p>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4 project-card-container" data-category="bootstrap" role="listitem" aria-label="Портфолио — Bootstrap">
                <a href="https://plovika.github.io/kr1site/index.html" target="_blank" class="card project-card shadow-sm text-decoration-none" rel="noopener">
                    <picture>
                        <source srcset="../images/project4-small.jpg" media="(max-width: 768px)">
                        <source srcset="../images/project4-large.jpg" media="(min-width: 769px)">
                        <img src="../images/project4-large.jpg" alt="Скриншот портфолио с проектами" class="project-img card-img-top" loading="lazy" width="400" height="250">
                    </picture>
                    <div class="card-body text-center">
                        <h3 class="card-title h5">Портфолио</h3>
                        <p class="card-text">Bootstrap</p>
                    </div>
                </a>
            </div>

        </div>
    </section>
</main>

<footer class="footer text-center py-3 bg-white border-top shadow-sm" role="contentinfo">
    <p>© 2025 <a href="../pages/contacts.html" class="text-decoration-none text-primary fw-semibold">Контакты</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (function () {
        const filterButtons = document.querySelectorAll('.filter-btn');
        const projectCards = document.querySelectorAll('.project-card-container');
        const filterStatus = document.getElementById('filter-status');

        function updateFilterStatus(text) {
            filterStatus.textContent = text;
        }

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                });
                button.classList.add('active');
                button.setAttribute('aria-pressed', 'true');

                const filter = button.getAttribute('data-filter');
                let visibleCount = 0;

                projectCards.forEach(card => {
                    const category = card.getAttribute('data-category');
                    const shouldShow = (filter === 'all' || category === filter);
                    card.style.display = shouldShow ? '' : 'none';
                    card.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
                    if (shouldShow) visibleCount++;
                });

                updateFilterStatus(`${visibleCount} проект(а/ов) показано.`);
            });
        });
    })();
</script>
</body>
</html>
